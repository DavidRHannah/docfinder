[project]
name = "docfinder"
version = "0.1.0"
description = "Automatically discover documentation for packages, classes, and methods used in a Python codebase"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "David Hannah" }
]
keywords = ["documentation", "ast", "intersphinx", "cdk", "boto3", "onboarding", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Documentation",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
docfinder = "docfinder.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
